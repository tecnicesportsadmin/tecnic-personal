<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4D3A">
<meta name="robots" content="noindex, nofollow">
<title>Tècnic Esports · Personal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --verd:#1F4D3A; --verd-fosc:#163828; --verd-clar:#E3EEE7; --fons:#F4F5F2; --tinta:#1B2421;
  --gris:#4D5752; --gris2:#3F4944; --linia:#DDE2DC; --linia2:#C9CFC9; --suau:#ECEFEB;
  --accent:#C2501F; --accent-text:#9C3E15;
  --ok-t:#1F5B3A; --ok-b:#DFF2E6; --warn-t:#7A4B00; --warn-b:#FFF1D6; --ko-t:#9B2C22; --ko-b:#FBE3E1;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fons);color:var(--tinta);font-family:Inter,system-ui,sans-serif;font-size:15px;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:'Space Grotesk',Inter,sans-serif;font-weight:600;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--verd)}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Botons i camps */
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1.5px solid var(--linia2);background:#fff;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--tinta)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.prim{background:var(--verd);border-color:var(--verd);color:#fff}
.btn.prim:hover:not(:disabled){background:var(--verd-fosc)}
.btn.ko{color:var(--ko-t)}
.btn.full{width:100%}
.btn.small{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.icon-btn{width:44px;height:44px;border:0;background:transparent;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--tinta)}
.icon-btn:hover{background:var(--suau)}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:14px;font-weight:600}
.inp{min-height:48px;border:1.5px solid var(--linia2);border-radius:12px;padding:0 14px;background:#fff;width:100%}
textarea.inp{padding:12px 14px;resize:vertical;min-height:72px}
.inp:focus,.btn:focus-visible,.icon-btn:focus-visible{outline:3px solid #8FB9A3;outline-offset:1px}
.hint{font-size:13px;color:var(--gris)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:#E3E7E2;border-radius:12px;padding:4px}
.seg button{min-height:42px;border:0;border-radius:9px;background:transparent;font-weight:600;font-size:13px;cursor:pointer;color:var(--gris2)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--verd);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--linia2);background:#fff;font-weight:600;font-size:13px;cursor:pointer;color:var(--gris2)}
.chip[aria-pressed="true"]{background:var(--tinta);border-color:var(--tinta);color:#fff}

/* Etiquetes */
.tag{font-size:12px;font-weight:700;border-radius:8px;padding:4px 8px;white-space:nowrap;display:inline-block}
.tag.pendent{color:var(--warn-t);background:var(--warn-b)}
.tag.aprovada,.tag.ok{color:var(--ok-t);background:var(--ok-b)}
.tag.rebutjada,.tag.ko{color:var(--ko-t);background:var(--ko-b)}
.tag.cancellada,.tag.neutre{color:var(--gris2);background:var(--suau)}
.tag.nou{color:#fff;background:var(--accent)}
.msg-box{font-size:13px;font-weight:600;border-radius:10px;padding:9px 12px}
.msg-box.ok{color:var(--ok-t);background:var(--ok-b)}
.msg-box.ko{color:var(--ko-t);background:var(--ko-b)}
.msg-box.warn{color:var(--warn-t);background:var(--warn-b)}

/* Estructura */
#app{min-height:100vh;display:flex;flex-direction:column}
.topbar{background:var(--verd);color:#fff;position:sticky;top:0;z-index:20}
.topbar-in{max-width:1280px;margin:0 auto;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:12px}
.marca{display:flex;align-items:center;gap:8px;font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:.12em;font-size:13px}
.avatar{width:38px;height:38px;border-radius:19px;background:#fff;color:var(--verd);border:0;font-weight:700;cursor:pointer;margin-left:auto;display:flex;align-items:center;justify-content:center}
.topnav{display:none;gap:4px}
.topnav a{padding:9px 14px;border-radius:10px;color:#fff;text-decoration:none;font-weight:500;font-size:14px;display:flex;align-items:center;gap:6px}
.topnav a[aria-current="page"]{background:rgba(255,255,255,.16);font-weight:700}
main.view{flex:1;width:100%;max-width:640px;margin:0 auto;padding:18px 16px 110px;display:flex;flex-direction:column;gap:14px}
main.view.wide{max-width:1280px}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--linia);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:6px 8px max(10px,env(safe-area-inset-bottom))}
.bottomnav a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;text-decoration:none;color:var(--gris);font-size:11.5px;font-weight:500}
.bottomnav a[aria-current="page"]{color:var(--verd);font-weight:700}
.badge{min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.bottomnav .badge{position:absolute;top:2px;left:calc(50% + 6px)}
@media (min-width:900px){
  .topnav{display:flex}
  .bottomnav{display:none}
  main.view{padding-bottom:40px}
  .avatar{margin-left:12px}
  .topnav{margin-left:auto}
}
.cap{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.cap h1{font-size:26px}
.sec-title{margin:6px 0 0;font-family:Inter,sans-serif;font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--gris);text-transform:uppercase}
.card{background:#fff;border:1px solid var(--linia);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.card.link{cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.card.link:hover{border-color:var(--linia2)}
.card.alerta{border:2px solid var(--accent)}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.buit{padding:28px 16px;text-align:center;color:var(--gris);background:#fff;border:1px dashed var(--linia2);border-radius:16px}

/* Horari */
.setmana{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--linia);border-radius:14px;padding:4px}
.setmana .t{display:flex;flex-direction:column;align-items:center}
.setmana .t b{font-size:16px}.setmana .t span{font-size:12px;color:var(--gris)}
.resum{display:flex;gap:16px;font-size:13px;color:var(--gris2);flex-wrap:wrap}
.dia{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 14px 8px 8px;border-radius:14px;background:#fff;border:1px solid var(--linia);cursor:pointer;width:100%;text-align:left}
.dia.festa{background:var(--suau);border:1px dashed var(--linia2)}
.dia.avui{border:2px solid var(--verd)}
.dia .num{width:42px;flex:0 0 auto;display:flex;flex-direction:column;align-items:center}
.dia .num small{font-size:12px;font-weight:600;color:var(--gris);text-transform:uppercase}
.dia .num b{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:600}
.dia .mig{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.dia .hores{font-size:14px;font-weight:600}
.dia.festa .hores{font-weight:500;color:var(--gris)}
.dia .tot{font-size:14px;font-weight:600;color:var(--gris2)}
.barra{position:relative;height:8px;border-radius:4px;background:#E3E7E2}
.barra span{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--verd)}
.nota{font-size:12.5px;color:var(--gris2)}
.hores .tram{white-space:nowrap}

/* Horari "a pantalla completa": els 7 dies sempre visibles, sense desplaçar ni fer zoom */
body.fit #app{height:100vh;height:100dvh;overflow:hidden}
body.fit main.view{flex:1;min-height:0;gap:8px;padding-top:12px;padding-bottom:calc(74px + env(safe-area-inset-bottom))}
body.fit .cap h1{font-size:clamp(20px,3.2dvh,26px)}
body.fit .setmana{padding:2px}
body.fit .setmana .icon-btn{width:44px;height:clamp(36px,5.4dvh,44px)}
body.fit .setmana .t b{font-size:clamp(14px,2.1dvh,16px)}
body.fit .resum{font-size:clamp(11.5px,1.75dvh,13px);gap:12px;align-items:center}
body.fit .resum .btn.small{min-height:30px;padding:0 10px}
.dies{display:flex;flex-direction:column;gap:6px}
body.fit .dies{flex:1;min-height:0;display:grid;grid-template-rows:repeat(7,minmax(0,1fr));gap:clamp(3px,.7dvh,6px);max-height:640px}
body.fit .dia{min-height:0;height:100%;padding:2px 12px 2px 6px;gap:10px;border-radius:12px;overflow:hidden}
body.fit .dia.avui{padding-left:5px}
body.fit .dia .num{width:38px}
body.fit .dia .num small{font-size:clamp(10px,1.5dvh,12px);line-height:1.1}
body.fit .dia .num b{font-size:clamp(15px,2.6dvh,20px);line-height:1.1}
body.fit .dia .mig{gap:clamp(2px,.6dvh,6px)}
body.fit .dia .mig>.row{gap:4px 6px}
body.fit .dia .hores{font-size:clamp(12px,1.85dvh,14px);line-height:1.2;display:flex;flex-wrap:wrap;column-gap:6px}
body.fit .dia .tot{font-size:clamp(12px,1.8dvh,14px)}
body.fit .dia .tag{display:none}
body.fit .dia.pend{background:var(--warn-b);border-color:#D9A441}
body.fit .dia.avui .num{background:var(--verd);color:#fff;border-radius:9px;padding:2px 0}
body.fit .dia.avui .num small{color:#fff}
.llegenda-pend{display:none}
body.fit .llegenda-pend{display:inline-flex;align-items:center;gap:6px}
body.fit .llegenda-pend i{width:12px;height:12px;border-radius:3px;background:var(--warn-b);border:1.5px solid #D9A441}
body.fit .barra{height:clamp(4px,.8dvh,8px)}
body.fit .nota{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11.5px}
body.fit .peu-horari{display:none}
@media (min-width:900px){body.fit main.view{padding-bottom:20px}}
/* Mòbils molt petits: la nota del dia es veu en tocar-lo */
@media (max-height:600px){body.fit .nota{display:none}body.fit .resum{gap:10px}}
/* Pantalles molt baixes (mòbil apaïsat): no hi cap; es torna a la llista normal */
@media (max-height:500px){
  body.fit #app{height:auto;overflow:visible}
  body.fit main.view{padding-bottom:110px}
  body.fit .dies{display:flex}
  body.fit .dia{min-height:54px}
}

/* Missatges */
.fil{display:flex;flex-direction:column;gap:12px}
.bombolla{display:flex;flex-direction:column;gap:4px;max-width:85%}
.bombolla .qui{font-size:12px;font-weight:600;color:var(--gris)}
.bombolla .txt{border-radius:16px;padding:10px 14px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
.bombolla .quan{font-size:11px;color:var(--gris)}
.bombolla.meu{align-self:flex-end;align-items:flex-end}
.bombolla.meu .txt{background:var(--verd);color:#fff;border-radius:16px 16px 4px 16px}
.bombolla.altre{align-self:flex-start}
.bombolla.altre .txt{background:#fff;border:1px solid var(--linia);border-radius:16px 16px 16px 4px}
.sistema{align-self:center;font-size:12px;color:var(--gris);background:#E7EBE6;border-radius:10px;padding:4px 10px}

/* Planificació */
.taula-wrap{overflow-x:auto;background:#fff;border:1px solid var(--linia);border-radius:16px}
.taula{min-width:1060px}
.tr{display:grid;grid-template-columns:170px repeat(7,minmax(112px,1fr)) 64px;border-bottom:1px solid #ECEFEB}
.tr.cap-t{background:#F8F9F7;border-bottom:1px solid var(--linia)}
.tr .th{padding:12px 8px;font-size:13px;font-weight:700;text-align:center}
.tr .th.nomcol{text-align:left;padding-left:16px;font-size:12px;color:var(--gris);text-transform:uppercase;letter-spacing:.05em}
.tr .nom{padding:10px 16px;font-size:14px;font-weight:600;display:flex;align-items:center}
.tr .td{padding:5px}
.tr .tot{display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.cel{width:100%;min-height:54px;border-radius:10px;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font-size:12px;border:1px solid #A9C7B4;background:var(--verd-clar)}
.cel b{font-size:12px;font-weight:600}
.cel.festa{background:var(--suau);border:1px dashed #A3ABA6;color:var(--gris)}
.cel.buida{background:#fff;border:1px dashed var(--linia2);color:#8A938E;font-size:20px}
.cel.pend{background:var(--warn-b);border:1.5px solid #D9A441}
.llegenda{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--gris2)}
.llegenda i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px}

/* Documents */
.doc{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--linia);border-radius:14px;padding:10px 8px 10px 12px}
.doc .ico{width:40px;height:40px;flex:0 0 auto;border-radius:10px;display:flex;align-items:center;justify-content:center}
.doc .ico.nomina{background:var(--verd-clar);color:var(--verd)}
.doc .ico.contracte{background:#FBE9DF;color:var(--accent-text)}
.doc .ico.altres{background:#E7EBE6;color:var(--gris2)}
.doc .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.doc .info b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc .info span{font-size:13px;color:var(--gris)}
.privat{display:flex;gap:10px;align-items:center;padding:12px 14px;background:var(--verd);color:#fff;border-radius:12px;font-size:13px;line-height:1.4}

/* Full modal */
.sheet-bg{position:fixed;inset:0;background:rgba(20,28,25,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--fons);width:100%;max-width:640px;max-height:94vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:22px;max-height:88vh}}
.sheet-cap{display:flex;align-items:center;gap:6px;padding:12px 10px 10px 8px;background:#fff;border-bottom:1px solid var(--linia)}
.sheet-cap h2{font-size:19px;flex:1}
.sheet-cos{padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;flex:1}
.sheet-peu{padding:10px 12px max(14px,env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--linia);display:flex;gap:8px;align-items:center}

/* Accés */
.login{min-height:100vh;background:var(--verd);display:flex;flex-direction:column}
.login .dalt{color:#fff;padding:64px 28px 36px;display:flex;flex-direction:column;gap:12px;max-width:520px;width:100%;margin:0 auto}
.login .dalt h1{font-size:32px;line-height:1.1}
.login form{flex:1;background:var(--fons);border-radius:28px 28px 0 0;padding:30px 28px 40px;display:flex;flex-direction:column;gap:20px}
.login form>*{max-width:464px;width:100%;margin-left:auto;margin-right:auto}
.pin{letter-spacing:.6em;font-size:26px;font-weight:700;text-align:center;min-height:58px}

/* Avisos */
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:80;background:var(--tinta);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;max-width:92vw;box-shadow:0 6px 24px rgba(0,0,0,.2)}
#toast.ko{background:var(--ko-t)}
.carregant{padding:40px;text-align:center;color:var(--gris)}
</style>
</head>
<body>
<div id="app"><div class="carregant">Carregant…</div></div>
<div id="modal"></div>
<div id="toast" class="hidden" role="status" aria-live="polite"></div>

<script>
'use strict';
/* =====================================================================
   CONFIGURACIÓ — omplir amb les dades del projecte Supabase de Tècnic
   (Settings → API Keys). La clau "publishable" és pública per disseny:
   la seguretat la posen les regles RLS de la base de dades.
   ===================================================================== */
var SUPABASE_URL = 'https://sunahbfnwhjjtxiajfpz.supabase.co';
var SUPABASE_KEY = 'sb_publishable_LQdIiGbdGCdKb5_tTUFJCQ_ogggQgOv';

/* Ha de ser IDÈNTIC a la funció de servidor gestio-usuaris */
function pinAContrasenya(pin) { return 'TE-' + pin + '-personal'; }

/* =====================================================================
   UTILITATS
   ===================================================================== */
var DIES = ['Dl', 'Dt', 'Dc', 'Dj', 'Dv', 'Ds', 'Dg'];
var DIES_LLARGS = ['dilluns', 'dimarts', 'dimecres', 'dijous', 'divendres', 'dissabte', 'diumenge'];
var MESOS = ['gener', 'febrer', 'març', 'abril', 'maig', 'juny', 'juliol', 'agost', 'setembre', 'octubre', 'novembre', 'desembre'];
var MESOS_CURTS = ['gen', 'febr', 'març', 'abr', 'maig', 'juny', 'jul', 'ag', 'set', 'oct', 'nov', 'des'];
var TIPUS_SOL = { canvi_horari: 'Canvi d’horari', dia_lliure: 'Dia lliure', intercanvi: 'Intercanvi' };
var ESTATS = { pendent: 'Pendent', aprovada: 'Aprovada', rebutjada: 'Rebutjada', cancellada: 'Cancel·lada' };
var TIPUS_TORN = { treball: 'Treball', festa: 'Festa', vacances: 'Vacances', absencia: 'Absència' };
var TIPUS_DOC = { nomina: 'Nòmina', contracte: 'Contracte', altres: 'Altres' };
var ROLS = { treballador: 'Treballador/a', supervisor: 'Supervisor/a', admin: 'Administrador/a' };

function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function pad(n) { return (n < 10 ? '0' : '') + n; }
function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parseYmd(s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function addDays(d, n) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; }
function dilluns(d) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
function avui() { return ymd(new Date()); }
function dw(d) { return (d.getDay() + 6) % 7; }
function deMes(m) { var n = MESOS[m]; return /^[aeiou]/.test(n) ? 'd’' + n : 'de ' + n; }
function dataCurta(s) { var d = parseYmd(s); return DIES[dw(d)] + ' ' + d.getDate() + ' ' + MESOS_CURTS[d.getMonth()]; }
function dataLlarga(s) { var d = parseYmd(s); return DIES_LLARGS[dw(d)] + ' ' + d.getDate() + ' ' + deMes(d.getMonth()); }
function rangSetmana(ini) {
  var fi = addDays(ini, 6);
  if (ini.getMonth() === fi.getMonth()) return ini.getDate() + ' – ' + fi.getDate() + ' ' + deMes(fi.getMonth());
  return ini.getDate() + ' ' + MESOS_CURTS[ini.getMonth()] + ' – ' + fi.getDate() + ' ' + MESOS_CURTS[fi.getMonth()];
}
function hm(t) { if (!t) return ''; var p = String(t).split(':'); return parseInt(p[0], 10) + ':' + p[1]; }
function hm5(t) { if (!t) return ''; var p = String(t).split(':'); return pad(parseInt(p[0], 10)) + ':' + p[1]; }
function minuts(t) { if (!t) return null; var p = String(t).split(':'); return parseInt(p[0], 10) * 60 + parseInt(p[1], 10); }
function horesTxt(min) { var h = min / 60; return (Math.round(h * 10) / 10).toString().replace('.', ',') + ' h'; }
function quan(ts) {
  var d = new Date(ts), ara = new Date();
  var hora = pad(d.getHours()) + ':' + pad(d.getMinutes());
  if (ymd(d) === ymd(ara)) return 'Avui, ' + hora;
  if (ymd(d) === ymd(addDays(ara, -1))) return 'Ahir, ' + hora;
  return d.getDate() + ' ' + MESOS_CURTS[d.getMonth()] + ', ' + hora;
}

function trams(t) {
  if (!t || t.tipus !== 'treball' || !t.entrada) return [];
  if (t.inici_pausa && t.fi_pausa) return [[t.entrada, t.inici_pausa], [t.fi_pausa, t.sortida]];

}

}

/* Mateixa regla que la base de dades: pausa entre 1 i 3 hores */
function validaHores(e, ip, fp, s) {
  if (!e || !s) return { ok: false, msg: 'Cal l’hora d’entrada i de sortida.' };
  var me = minuts(e), ms = minuts(s);
  if (!(me < ms)) return { ok: false, msg: 'La sortida ha de ser després de l’entrada.' };
  if (!ip && !fp) return { ok: true, msg: 'Jornada sense pausa · ' + horesTxt(ms - me) + ' de treball' };
  if (!ip || !fp) return { ok: false, msg: 'Indica l’inici i el final de la pausa (o cap dels dos).' };
  var mi = minuts(ip), mf = minuts(fp);
  if (!(me < mi && mi < mf && mf < ms)) return { ok: false, msg: 'La pausa ha d’estar dins de la jornada.' };
  var p = mf - mi;
  var pt = Math.floor(p / 60) + ' h' + (p % 60 ? ' ' + (p % 60) + ' min' : '');
  if (p < 60 || p > 180) return { ok: false, msg: 'La pausa per dinar ha de durar entre 1 i 3 hores (ara ' + pt + ').' };
  return { ok: true, msg: 'Pausa de ' + pt + ' · ' + horesTxt(ms - me - p) + ' de treball' };
}

async function login(form) {

  var email = form.querySelector('#l-email').value.trim().toLowerCase();
  var pin = form.querySelector('#l-pin').value.trim();
  if (!email || !/^\d{4}$/.test(pin)) return mostra('Escriu el teu email i un PIN de 4 xifres.');
  var btn = form.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = 'Entrant…';
  var r = await sb.auth.signInWithPassword({ email: email, password: pinAContrasenya(pin) });
  btn.disabled = false; btn.textContent = 'Entrar';
  if (r.error) {
    S.intents++;
    if (S.intents >= 5) { S.bloqueigFins = Date.now() + 30000; S.intents = 0; }
    if (r.error.status === 429) return mostra('Massa intents. Espera uns minuts.');

    await sb.auth.signOut();

  S.me = r.data;
  await carregaDirectori();
  var v = location.hash.slice(1);
  S.vista = pestanyes().some(function (p) { return p.id === v; }) ? v : (esSup() ? 'sollicituds' : 'horari');
  subscriu();
  pinta();
}

        '<button type="button" class="btn" data-act="canvia-pin-usuari" data-id="' + u.id + '">Posar aquest PIN</button></div>' +
      '<div class="card" style="gap:10px"><b>Canviar l’email</b><label for="e-email" class="sr">Nou email</label><input id="e-email" class="inp" type="email" value="' + esc(u.email) + '">' +
        '<button type="button" class="btn" data-act="canvia-email" data-id="' + u.id + '">Desar email</button></div>' +
      (jo ? '' : '<button type="button" class="btn ' + (u.actiu ? 'ko' : '') + '" data-act="activa-usuari" data-id="' + u.id + '" data-actiu="' + (u.actiu ? 0 : 1) + '">' + (u.actiu ? 'Desactivar (deixarà d’entrar i de veure res)' : 'Tornar a activar') + '</button>') +
      '<div id="e-err" class="msg-box ko hidden" role="alert"></div></form>');
}
async function desaUsuari(form) {
  var id = form.getAttribute('data-id'), canvis = { nom: E(form, 'nom').value.trim(), gestiona_documents: E(form, 'docs').checked };
  if (!E(form, 'rol').disabled) canvis.rol = E(form, 'rol').value;
  if (!canvis.nom) return toast('Cal el nom', true);
  var r = await sb.from('perfils').update(canvis).eq('id', id);
  if (r.error) return toast(errMsg(r.error), true);
  if (id === S.me.id) { S.me = Object.assign(S.me, canvis); }
  await carregaDirectori();
  tancaModal(true); toast('Desat');
}
async function accioUsuari(body, okMsg, tanca) {
  var err = document.getElementById('e-err');
  try { await crida(body); toast(okMsg); if (tanca) { await carregaDirectori(); tancaModal(true); } }
  catch (e) { if (err) { err.textContent = errMsg(e); err.classList.remove('hidden'); } else toast(errMsg(e), true); }
}

async function modalPlantilla(id) {
  var p = id ? q(await sb.from('plantilles').select('*').eq('id', id).single()) : { nom: '', entrada: '09:00', inici_pausa: '13:00', fi_pausa: '16:00', sortida: '20:00', ordre: 10 };
  obreModal(capModal(id ? 'Editar plantilla' : 'Nova plantilla') +
    '<form class="sheet-cos" data-form="plantilla" data-id="' + (id || '') + '" novalidate>' +
      '<div class="field"><label for="p-nom">Nom</label><input id="p-nom" name="nom" class="inp" maxlength="40" value="' + esc(p.nom) + '" autofocus></div>' +
      '<div class="grid2">' +
      '<div class="field"><label for="c-e">Entrada</label><input id="c-e" name="entrada" class="inp" type="time" step="900" value="' + hm5(p.entrada) + '" data-change="cel-hores"></div>' +
      '<div class="field"><label for="c-s">Sortida</label><input id="c-s" name="sortida" class="inp" type="time" step="900" value="' + hm5(p.sortida) + '" data-change="cel-hores"></div>' +
      '<div class="field"><label for="c-ip">Inici pausa</label><input id="c-ip" name="inici_pausa" class="inp" type="time" step="900" value="' + hm5(p.inici_pausa) + '" data-change="cel-hores"></div>' +
      '<div class="field"><label for="c-fp">Fi pausa</label><input id="c-fp" name="fi_pausa" class="inp" type="time" step="900" value="' + hm5(p.fi_pausa) + '" data-change="cel-hores"></div></div>' +
      '<div id="cel-val" class="msg-box ok" role="status"></div>' +
      '<div class="field"><label for="p-ordre">Ordre</label><input id="p-ordre" name="ordre" class="inp" type="number" min="0" max="999" value="' + esc(p.ordre) + '"></div>' +
      '<div id="cel-err" class="msg-box ko hidden" role="alert"></div>' +
      '<div class="grid2">' + (id ? '<button type="button" class="btn ko" data-act="esborra-plantilla" data-id="' + id + '">' + ICO.paperera + 'Esborrar</button>' : '<span></span>') + '<button class="btn prim" type="submit">Desar</button></div></form>');
  validaCel();
}
async function desaPlantilla(form) {
  var v = validaCel(), err = document.getElementById('cel-err');
  if (!E(form, 'nom').value.trim()) { err.textContent = 'Cal un nom.'; err.classList.remove('hidden'); return; }
  if (!v.ok) { err.textContent = v.msg; err.classList.remove('hidden'); return; }
  var fila = { nom: E(form, 'nom').value.trim(), entrada: E(form, 'entrada').value, sortida: E(form, 'sortida').value, inici_pausa: E(form, 'inici_pausa').value || null, fi_pausa: E(form, 'fi_pausa').value || null, ordre: parseInt(E(form, 'ordre').value, 10) || 0 };
  var id = form.getAttribute('data-id');
  var r = id ? await sb.from('plantilles').update(fila).eq('id', id) : await sb.from('plantilles').insert(fila);
  if (r.error) { err.textContent = errMsg(r.error); err.classList.remove('hidden'); return; }
  tancaModal(true); toast('Plantilla desada');
}

/* ---------- El meu compte ---------- */
function modalPerfil() {
  obreModal(capModal('El meu compte') +
    '<form class="sheet-cos" data-form="canvia-pin" novalidate>' +
      '<div class="card" style="gap:4px"><b>' + esc(S.me.nom) + '</b><span class="hint">' + esc(S.me.email) + ' · ' + esc(ROLS[S.me.rol]) + '</span></div>' +
      '<b>Canviar el meu PIN</b>' +
      '<div class="field"><label for="m-act">PIN actual</label><input id="m-act" name="act" class="inp pin" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password"></div>' +
      '<div class="grid2"><div class="field"><label for="m-nou">PIN nou</label><input id="m-nou" name="nou" class="inp pin" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password"></div>' +
      '<div class="field"><label for="m-rep">Repeteix-lo</label><input id="m-rep" name="rep" class="inp pin" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password"></div></div>' +
      '<div id="m-err" class="msg-box ko hidden" role="alert"></div>' +
      '<button class="btn prim" type="submit">Canviar PIN</button>' +
      '<button type="button" class="btn" data-act="surt" style="margin-top:12px">Tancar la sessió</button></form>');
}
async function canviaPin(form) {
  var err = document.getElementById('m-err');
  function mostra(m) { err.textContent = m; err.classList.remove('hidden'); }
  var a = E(form, 'act').value, n = E(form, 'nou').value, r2 = E(form, 'rep').value;
  if (!/^\d{4}$/.test(a) || !/^\d{4}$/.test(n)) return mostra('Els PIN han de tenir 4 xifres.');
  if (n !== r2) return mostra('Els dos PIN nous no coincideixen.');
  if (n === a) return mostra('El PIN nou ha de ser diferent.');
  if (/^(\d)\1{3}$/.test(n) || n === '1234' || n === '0000') return mostra('Tria un PIN menys fàcil d’endevinar.');
  var chk = await sb.auth.signInWithPassword({ email: S.me.email, password: pinAContrasenya(a) });
  if (chk.error) return mostra('El PIN actual no és correcte.');
  var r = await sb.auth.updateUser({ password: pinAContrasenya(n) });
  if (r.error) return mostra(errMsg(r.error));
  tancaModal(); toast('PIN canviat');
}

/* =====================================================================
   ESDEVENIMENTS (delegats)
   ===================================================================== */
document.addEventListener('click', async function (e) {
  var el = e.target.closest('[data-act]'); if (!el) return;
  var a = el.getAttribute('data-act');
  if (a === 'fons') { if (e.target === el) tancaModal(); return; }
  if (el.tagName === 'A') return;
  e.preventDefault();
  try {
    switch (a) {
      case 'tanca': tancaModal(); break;
      case 'recarrega': pintaVista(); break;
      case 'perfil': modalPerfil(); break;
      case 'surt': tancaModal(); await surt(); break;
      case 'setmana': {
        var dir = parseInt(el.getAttribute('data-dir'), 10);
        S.setmana = dir === 0 ? dilluns(new Date()) : addDays(S.setmana, 7 * dir); pintaVista(); break;
      }
      case 'setmana-plan': S.setmanaPlan = addDays(S.setmanaPlan, 7 * parseInt(el.getAttribute('data-dir'), 10)); pintaVista(); break;
      case 'nova-sol': await modalNovaSol(el.getAttribute('data-data')); break;
      case 'tipus-sol': {
        var t = el.getAttribute('data-t'), f = el.closest('form');
        E(f, 'tipus').value = t;
        f.querySelectorAll('[data-act="tipus-sol"]').forEach(function (b) { b.setAttribute('aria-pressed', String(b === el)); });
        document.getElementById('ns-canvi').classList.toggle('hidden', t !== 'canvi_horari');
        document.getElementById('ns-lliure').classList.toggle('hidden', t !== 'dia_lliure');
        document.getElementById('ns-inter').classList.toggle('hidden', t !== 'intercanvi');
        break;
      }
      case 'fil': await modalFil(el.getAttribute('data-id')); break;
      case 'resp-inter': {
        var ok = el.getAttribute('data-ok') === '1';
        if (!ok && !confirm('Rebutjar l’intercanvi?')) break;
        q(await sb.rpc('respondre_intercanvi', { p_id: el.getAttribute('data-id'), p_accepta: ok }));
        toast(ok ? 'Acceptat. Ara ho ha d’aprovar un supervisor.' : 'Intercanvi rebutjat');
        tancaModal(true); break;
      }
      case 'resol': {
        var aprova = el.getAttribute('data-ok') === '1', txt = document.getElementById('fil-txt');
        var comentari = txt && txt.value.trim() || null;
        if (!aprova && !comentari && !confirm('Rebutjar sense explicar el motiu?\n(Pots escriure’l a la caixa de missatges abans.)')) break;
        q(await sb.rpc('resoldre_sollicitud', { p_id: el.getAttribute('data-id'), p_aprovar: aprova, p_comentari: comentari }));
        toast(aprova ? 'Aprovada · horari actualitzat' : 'Rebutjada');
        tancaModal(true); break;
      }
      case 'cancella':
        if (!confirm('Cancel·lar aquesta sol·licitud?')) break;
        q(await sb.rpc('cancellar_sollicitud', { p_id: el.getAttribute('data-id') }));
        toast('Sol·licitud cancel·lada'); tancaModal(true); break;
      case 'cel': await modalCel(el.getAttribute('data-p'), el.getAttribute('data-d')); break;
      case 'tipus-cel': {
        var tc = el.getAttribute('data-t'), fc = el.closest('form');
        E(fc, 'tipus').value = tc;
        fc.querySelectorAll('[data-act="tipus-cel"]').forEach(function (b) { b.setAttribute('aria-pressed', String(b === el)); });
        document.getElementById('cel-hores').classList.toggle('hidden', tc !== 'treball');
        break;
      }
      case 'plantilla': {
        var p = S.plantilles[parseInt(el.getAttribute('data-i'), 10)];
        document.getElementById('c-e').value = hm5(p.entrada); document.getElementById('c-s').value = hm5(p.sortida);
        document.getElementById('c-ip').value = hm5(p.inici_pausa); document.getElementById('c-fp').value = hm5(p.fi_pausa);
        validaCel(); break;
      }
      case 'esborra-cel': {
        if (!confirm('Treure el torn d’aquest dia?')) break;
        q(await sb.from('torns').delete().eq('treballador_id', el.getAttribute('data-p')).eq('data', el.getAttribute('data-d')));
        tancaModal(true); toast('Torn tret'); break;
      }
      case 'copia-setmana': await copiaSetmana(); break;
      case 'filtre-docs': S.filtreDocs = el.getAttribute('data-f'); pintaVista(); break;
      case 'obre-doc': await obreDoc(el); break;
      case 'esborra-doc': await esborraDoc(el); break;
      case 'nou-usuari': modalNouUsuari(); break;
      case 'edita-usuari': await modalEditaUsuari(el.getAttribute('data-id')); break;
      case 'pin-nou': document.getElementById(el.getAttribute('data-for')).value = pinAleatori(); break;
      case 'canvia-pin-usuari': {
        var pin = document.getElementById('e-pin').value.trim();
        if (!/^\d{4}$/.test(pin)) { toast('El PIN ha de tenir 4 xifres', true); break; }
        await accioUsuari({ accio: 'canviar_pin', id: el.getAttribute('data-id'), pin: pin }, 'PIN canviat a ' + pin, false); break;
      }
      case 'canvia-email':
        await accioUsuari({ accio: 'canviar_email', id: el.getAttribute('data-id'), email: document.getElementById('e-email').value.trim() }, 'Email canviat', true); break;
      case 'activa-usuari': {
        var act = el.getAttribute('data-actiu') === '1';
        if (!act && !confirm('Desactivar aquest usuari? No podrà entrar ni veure res fins que el tornis a activar.')) break;
        await accioUsuari({ accio: 'activar', id: el.getAttribute('data-id'), actiu: act }, act ? 'Usuari activat' : 'Usuari desactivat', true); break;
      }
      case 'plantilla-edita': await modalPlantilla(el.getAttribute('data-id')); break;
      case 'esborra-plantilla':
        if (!confirm('Esborrar aquesta plantilla?')) break;
        q(await sb.from('plantilles').delete().eq('id', el.getAttribute('data-id')));
        tancaModal(true); toast('Plantilla esborrada'); break;
    }
  } catch (err) { toast(errMsg(err), true); }
});

document.addEventListener('submit', async function (e) {
  var f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault();
  var tipus = f.getAttribute('data-form');
  try {
    if (tipus === 'login') await login(f);
    else if (tipus === 'nova-sol') await enviaNovaSol(f);
    else if (tipus === 'missatge') await enviaMissatge(f);
    else if (tipus === 'cel') await desaCel(f);
    else if (tipus === 'puja') await pujaDoc(f);
    else if (tipus === 'nou-usuari') await creaUsuari(f);
    else if (tipus === 'edita-usuari') await desaUsuari(f);
    else if (tipus === 'plantilla') await desaPlantilla(f);
    else if (tipus === 'canvia-pin') await canviaPin(f);
  } catch (err) { toast(errMsg(err), true); }
});

function enCanvi(e) {
  var el = e.target.closest('[data-change]'); if (!el) return;
  var c = el.getAttribute('data-change');
  if (c === 'ns-hores') validaNovaSol();
  else if (c === 'ns-data' && e.type === 'change') omplirTornActual();
  else if (c === 'cel-hores') validaCel();
  else if (c === 'doc-titol') titolDoc();
  else if (c === 'filtre-treb' && e.type === 'change') { S.filtreTreb = el.value; pintaVista(); }
}
document.addEventListener('input', enCanvi);
document.addEventListener('change', enCanvi);
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && S.modal) tancaModal(); });

inici();
</script>
